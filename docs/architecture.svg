<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#111">Nexsale Lead Engine – n8n workflows around one Airtable base</text>
  <text x="24" y="58" fill="#555">Click 1 = form · Click 2 = "Campaign ready" in Slack · Click 3 = "Approve and launch". Everything else is automatic.</text>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <!-- Airtable -->
  <rect x="420" y="270" width="360" height="100" rx="10" fill="#fff4d6" stroke="#d8a800"/>
  <text x="600" y="298" text-anchor="middle" font-weight="bold">Airtable base</text>
  <text x="600" y="318" text-anchor="middle" fill="#444">Clients · Campaigns · Leads · Emails · Replies</text>
  <text x="600" y="336" text-anchor="middle" fill="#444">Meetings · Blocklist · Logs · Tasks</text>
  <text x="600" y="356" text-anchor="middle" fill="#777">status changes drive the modules + Interface dashboard</text>
  <g fill="#e8f0ff" stroke="#3b6fd8">
    <rect x="40" y="100" width="180" height="56" rx="8"/><rect x="250" y="100" width="180" height="56" rx="8"/>
    <rect x="460" y="100" width="180" height="56" rx="8"/><rect x="670" y="100" width="180" height="56" rx="8"/>
    <rect x="880" y="100" width="180" height="56" rx="8"/>
    <rect x="40" y="480" width="180" height="56" rx="8"/><rect x="250" y="480" width="180" height="56" rx="8"/>
    <rect x="460" y="480" width="180" height="56" rx="8"/><rect x="670" y="480" width="180" height="56" rx="8"/>
    <rect x="880" y="480" width="180" height="56" rx="8"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="124" font-weight="bold">01 Campaign form</text><text x="130" y="143" fill="#444">click 1</text>
    <text x="340" y="124" font-weight="bold">02 Sourcing</text><text x="340" y="143" fill="#444">Google Places, 1 request</text>
    <text x="550" y="124" font-weight="bold">03 Enrichment</text><text x="550" y="143" fill="#444">Impressum · MX · score</text>
    <text x="760" y="124" font-weight="bold">04 AI emails</text><text x="760" y="143" fill="#444">4 steps · quality ≥ 80</text>
    <text x="970" y="124" font-weight="bold">Slack: Campaign ready</text><text x="970" y="143" fill="#444">click 2 · click 3</text>
    <text x="130" y="504" font-weight="bold">05 Launch checks</text><text x="130" y="523" fill="#444">5 checks → Live</text>
    <text x="340" y="504" font-weight="bold">06 Sending</text><text x="340" y="523" fill="#444">day 0/3/7/14 · stop on reply</text>
    <text x="550" y="504" font-weight="bold">07 Replies · 07b · 07c</text><text x="550" y="523" fill="#444">AI sort · Calendly · reminders</text>
    <text x="760" y="504" font-weight="bold">10 HubSpot sync</text><text x="760" y="523" fill="#444">contact · company · deal</text>
    <text x="970" y="504" font-weight="bold">08 Dashboard + report</text><text x="970" y="523" fill="#444">guarantees 20 / 4–5</text>
  </g>
  <g stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <line x1="220" y1="128" x2="248" y2="128"/><line x1="430" y1="128" x2="458" y2="128"/><line x1="640" y1="128" x2="668" y2="128"/><line x1="850" y1="128" x2="878" y2="128"/>
    <polyline fill="none" points="1060,128 1075,128 1075,440 130,440 130,478"/>
    <line x1="220" y1="508" x2="248" y2="508"/><line x1="430" y1="508" x2="458" y2="508"/><line x1="640" y1="508" x2="668" y2="508"/>
  </g>
  <g stroke="#d8a800" stroke-dasharray="4 4" fill="none">
    <line x1="340" y1="156" x2="520" y2="270"/><line x1="550" y1="156" x2="580" y2="270"/><line x1="760" y1="156" x2="660" y2="270"/>
    <line x1="340" y1="480" x2="520" y2="370"/><line x1="550" y1="480" x2="590" y2="370"/><line x1="760" y1="480" x2="660" y2="370"/><line x1="970" y1="480" x2="740" y2="370"/>
  </g>
  <!-- side -->
  <rect x="1090" y="100" width="90" height="436" rx="8" fill="#f2f2f2" stroke="#999"/>
  <g text-anchor="middle" fill="#333" font-size="12">
    <text x="1135" y="130" font-weight="bold">shared</text>
    <text x="1135" y="160">13 send</text><text x="1135" y="176">(guard)</text>
    <text x="1135" y="210">14 AI call</text><text x="1135" y="226">(JSON, retry)</text>
    <text x="1135" y="260">15 Slack</text>
    <text x="1135" y="300">00 errors</text><text x="1135" y="316">→ Slack</text>
    <text x="1135" y="356">09 inbound</text>
    <text x="1135" y="390">11 Slack</text><text x="1135" y="406">buttons</text>
    <text x="1135" y="446">12 GDPR</text><text x="1135" y="462">delete</text>
  </g>
  <text x="24" y="580" fill="#b00020" font-weight="bold">Safety: every email passes 13_send_email → guard (allowlist + Blocklist; DEMO_MODE rewrites to the test inbox and adds [TEST]).</text>
  <text x="830" y="434" fill="#333" font-weight="bold">click 3 → launch</text>
  <text x="24" y="604" fill="#555">Solid arrows: kicks / clicks. Dashed: reads and writes in Airtable. All schedules Europe/Berlin.</text>
</svg>
