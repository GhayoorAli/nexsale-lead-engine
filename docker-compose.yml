# n8n + Postgres for the Nexsale Lead Engine. Timezone Europe/Berlin everywhere.
# Real use:   docker compose up -d                      (reads .env)
#             With COMPOSE_PROFILES=tunnel in .env this also starts the ngrok tunnel on your fixed
#             NGROK_DOMAIN, so the public URL (Slack, Calendly, forms) never changes.
# Test stack: see tests/README.md (uses docker-compose.test.yml, MOCK_EXTERNAL=true)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n_local_only}
      POSTGRES_DB: n8n
      TZ: Europe/Berlin
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.5
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-n8n_local_only}
      TZ: Europe/Berlin
      GENERIC_TIMEZONE: Europe/Berlin
      # Workflows read config (not secrets in JSON) from env via $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # OAuth logins (Gmail) return to the editor on this Mac, not to the changing tunnel URL
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Fixed public address for Slack buttons, Calendly and the forms (free ngrok static domain).
  # Starts only when .env has COMPOSE_PROFILES=tunnel, NGROK_AUTHTOKEN and NGROK_DOMAIN (docs/blockers.md).
  tunnel:
    image: ngrok/ngrok:3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["http", "n8n:5678", "--url=https://${NGROK_DOMAIN:-missing.ngrok-free.app}", "--log=stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
